name: Run News Update Hourly

on:
  schedule:
    # Every hour, on the hour (UTC). GitHub often delays scheduled runs by a
    # few minutes when the shared runner queue is busy - that is normal.
    - cron: "0 * * * *"
  workflow_dispatch:

# Never let two update runs overlap. Overlapping runs are what moved main from
# 3a1291c to 33485af while run #157 was still working, which is the root cause
# of the rebase conflict.
concurrency:
  group: hourly-news-update
  cancel-in-progress: false

# The job pushes commits, so the token needs write access to repo contents.
permissions:
  contents: write

# Which script builds the site. Leave it blank and the job finds it by itself.
# Only fill it in if the job picks the wrong file, e.g. GENERATOR: scripts/build.py
env:
  GENERATOR: ""

jobs:
  update-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        # v5 is the Node 24 build. v4 is the Node 20 build behind your
        # deprecation warning - Node 20 leaves the runners on 2026-09-16.
        uses: actions/checkout@v5

      - name: Setup Python
        # v6 is the Node 24 build of setup-python (v5 = Node 20).
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests feedparser beautifulsoup4
          fi

      - name: Generate updated index.html and database
        run: |
          set -euo pipefail

          SCRIPT="${GENERATOR:-}"

          # Try the usual names for a site generator, in order.
          if [ -z "$SCRIPT" ]; then
            for candidate in main.py app.py run.py index.py generate.py generator.py \
                             generate_site.py build.py build_site.py update.py \
                             update_news.py update_site.py news.py news_update.py \
                             news_scraper.py scraper.py fetch_news.py; do
              if [ -f "$candidate" ]; then
                SCRIPT="$candidate"
                break
              fi
            done
          fi

          # No familiar name, so fall back to the only Python file in the repo.
          if [ -z "$SCRIPT" ]; then
            mapfile -t FOUND < <(find . -name '*.py' -type f \
              -not -path './.git/*' -not -path './.github/*' \
              -not -path '*/venv/*' -not -path '*/.venv/*' \
              -not -path '*/site-packages/*' -printf '%P\n' | sort)
            if [ "${#FOUND[@]}" -eq 1 ]; then
              SCRIPT="${FOUND[0]}"
            fi
          fi

          if [ -z "$SCRIPT" ] || [ ! -f "$SCRIPT" ]; then
            echo "::error::Could not tell which script builds the site."
            echo "Python files in this repo:"
            find . -name '*.py' -type f -not -path './.git/*' -printf '  %P\n' | sort
            echo "Repo root contains:"
            ls -A | sed 's/^/  /'
            echo "Fix: copy the right filename into GENERATOR near the top of this workflow."
            exit 1
          fi

          echo "Building the site with: $SCRIPT"
          python "$SCRIPT"

      - name: Commit and push changes
        run: |
          set -euo pipefail

          FILES="index.html news_data.json"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fail loudly here rather than committing a half-built site.
          for f in $FILES; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not produced by the generator step - stopping."
              exit 1
            fi
          done

          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Site is already up to date - nothing to commit."
            exit 0
          fi

          # Park the freshly generated files outside the repo so the hard reset
          # below cannot destroy them.
          FRESH="$(mktemp -d)"
          cp $FILES "$FRESH"/

          for attempt in 1 2 3 4 5; do
            echo "--- push attempt $attempt ---"

            # Line up exactly with remote main. No merge and no rebase happens,
            # so there is nothing left for git to report a conflict on.
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD

            # Replay the fresh output on top of the current remote tip.
            for f in $FILES; do cp "$FRESH/$f" "$f"; done
            git add -- $FILES

            if git diff --cached --quiet; then
              echo "Remote already has identical content - nothing to push."
              exit 0
            fi

            git commit -m "Hourly news update ($(date -u '+%Y-%m-%d %H:%M UTC'))"

            if git push origin HEAD:main; then
              echo "Pushed $(git rev-parse --short HEAD) to main."
              exit 0
            fi

            echo "Remote moved ahead mid-push. Re-syncing and retrying..."
            sleep $(( RANDOM % 5 + 2 ))
          done

          echo "::error::Still could not push after 5 attempts."
          exit 1
